<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting</title>
    <meta name="description"
      content="Get in touch with Whitewater Rafting. Reach out with questions, make reservations, or send us your feedback and suggestions!">
    <meta name="author" content="Renato Rodrigues">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Whitewater Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Company Information Header -->
        <section class="company-contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Map & Form Side-by-Side Grid Layout -->
        <div class="contact-grid">
            <!-- Google Map Section -->
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2157071067716!2d-73.98784842343896!3d40.74844047138734!2m3!1f0!2f0!3f0!3m2!1f1024!2f768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="100%" height="400" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- Contact Form Section -->
            <section class="contact-form-section">
                <form action="#" method="post">
                    <div class="form-item">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <fieldset class="form-item">
                        <legend>Message Purpose</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="General Inquiry"
                              required>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose"
                              value="Reservation Question">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="website" name="purpose"
                              value="Website Suggestion">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-item checkbox-item">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>

        <!-- Employee Profiles Section -->
        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile">
                    <figcaption>David Nuñez</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile">
                    <figcaption>Sabrina Rodrigues</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile">
                    <figcaption>Adan Ventura</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 &#10070; Whitewater Rafting &#10070; Renato Rodrigues</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook-bw.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin-bw.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram-bw.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
